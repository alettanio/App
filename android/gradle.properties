# Adres komputera-serwera AutoSerwis Pro w sieci LAN (telefon musi być w tej samej sieci Wi-Fi).
# Zmień na IP komputera z uruchomionym autoservis-server, np. http://192.168.1.20:8080
# Dla emulatora Android zostaw 10.0.2.2 (adres komputera hosta z emulatora).
autoservis.serverUrl=http://10.0.2.2:8080

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true
